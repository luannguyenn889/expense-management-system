<main class="auth-page">
  <section class="auth-card" aria-labelledby="login-title">
    <a class="brand" routerLink="/login" aria-label="Ví Của Tôi - trang đăng nhập">
      <span class="brand-mark" aria-hidden="true">v.</span>
      <span>ví của tôi</span>
    </a>

    <div class="auth-heading">
      <p class="eyebrow">CHÀO MỪNG TRỞ LẠI</p>
      <h1 id="login-title">Đăng nhập</h1>
      <p class="auth-description">Đăng nhập để quản lý ví và theo dõi chi tiêu của bạn.</p>
    </div>

    @if (errorMessage()) {
      <p class="form-alert" role="alert">{{ errorMessage() }}</p>
    }

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
      <label class="field">
        <span>Email</span>
        <input
          formControlName="email"
          type="email"
          autocomplete="email"
          placeholder="ban@email.com"
          [attr.aria-invalid]="loginForm.controls.email.invalid && loginForm.controls.email.touched"
        />
        @if (loginForm.controls.email.touched && loginForm.controls.email.hasError('required')) {
          <small class="field-error">Vui lòng nhập email.</small>
        } @else if (loginForm.controls.email.touched && loginForm.controls.email.hasError('email')) {
          <small class="field-error">Email chưa đúng định dạng.</small>
        }
      </label>

      <label class="field">
        <span>Mật khẩu</span>
        <input
          formControlName="password"
          type="password"
          autocomplete="current-password"
          placeholder="Ít nhất 8 ký tự"
          [attr.aria-invalid]="loginForm.controls.password.invalid && loginForm.controls.password.touched"
        />
        @if (loginForm.controls.password.touched && loginForm.controls.password.hasError('required')) {
          <small class="field-error">Vui lòng nhập mật khẩu.</small>
        } @else if (loginForm.controls.password.touched && loginForm.controls.password.hasError('minlength')) {
          <small class="field-error">Mật khẩu phải có ít nhất 8 ký tự.</small>
        }
      </label>

      <button class="primary-button" type="submit" [disabled]="isLoading()">
        {{ isLoading() ? 'Đang đăng nhập...' : 'Đăng nhập' }}
      </button>
    </form>

    <p class="auth-footer">
      Chưa có tài khoản?
      <a routerLink="/register">Tạo tài khoản</a>
    </p>
  </section>
</main>
