<main class="auth-page">
  <section class="auth-card" aria-labelledby="login-title">
    <a
      class="brand"
      routerLink="/login"
      aria-label="Ví Của Tôi - trang đăng nhập"
    >
      <span class="brand-mark" aria-hidden="true">v.</span>
      <span>ví của tôi</span>
    </a>

    <div class="auth-heading">
      <p class="eyebrow">CHÀO MỪNG TRỞ LẠI</p>
      <h1 id="login-title">Đăng nhập</h1>
      <p class="auth-description">
        Đăng nhập để quản lý ví và theo dõi chi tiêu của bạn.
      </p>
    </div>

    @if (errorMessage()) {
      <p class="form-alert" role="alert">{{ errorMessage() }}</p>
    }

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
      <label class="field">
        <span>Tên đăng nhập</span>
        <input
          formControlName="username"
          type="text"
          autocomplete="username"
          placeholder="Tên đăng nhập hoặc email"
          [attr.aria-invalid]="
            loginForm.controls.username.invalid && loginForm.controls.username.touched
          "
        />
        @if (
          loginForm.controls.username.touched &&
          loginForm.controls.username.hasError('required')
        ) {
          <small class="field-error">Vui lòng nhập tên đăng nhập.</small>
        } @else if (
          loginForm.controls.username.touched &&
          (
            loginForm.controls.username.hasError('minlength') ||
            loginForm.controls.username.hasError('maxlength')
          )
        ) {
          <small class="field-error">
            Tên đăng nhập hoặc email phải có từ 3 đến 100 ký tự.
          </small>
        }
      </label>

      <label class="field">
        <span>Mật khẩu</span>
        <input
          formControlName="password"
          type="password"
          autocomplete="current-password"
          placeholder="Ít nhất 8 ký tự"
          [attr.aria-invalid]="
            loginForm.controls.password.invalid && loginForm.controls.password.touched
          "
        />
        @if (
          loginForm.controls.password.touched &&
          loginForm.controls.password.hasError('required')
        ) {
          <small class="field-error">Vui lòng nhập mật khẩu.</small>
        } @else if (
          loginForm.controls.password.touched &&
          loginForm.controls.password.hasError('minlength')
        ) {
          <small class="field-error">Mật khẩu phải có ít nhất 8 ký tự.</small>
        }
      </label>

      <button class="primary-button" type="submit" [disabled]="isLoading()">
        {{ isLoading() ? 'Đang đăng nhập...' : 'Đăng nhập' }}
      </button>
    </form>

    <div class="auth-divider" aria-hidden="true">
      <span>hoặc</span>
    </div>
    <div class="social-login-actions" aria-label="Đăng nhập bằng mạng xã hội">
      <button
        class="social-login-button google-button"
        type="button"
        aria-label="Đăng nhập bằng Google"
        title="Đăng nhập bằng Google"
        (click)="onGoogleLogin()"
      >
        <span class="google-mark" aria-hidden="true">G</span>
      </button>
    </div>
    @if (googleLoginMessage()) {
      <p class="form-alert" role="status">{{ googleLoginMessage() }}</p>
    }

    <p class="auth-footer">
      Chưa có tài khoản?
      <a routerLink="/register">Tạo tài khoản</a>
    </p>
  </section>
</main>
