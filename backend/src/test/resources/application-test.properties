spring.application.name=expense-management-backend-test

# Sử dụng H2 In-Memory Database cho môi trường Test (hoàn toàn không cần MySQL chạy)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT Test Secret
jwt.secret=mySecretKeyForTestingJwtTokenGenerationMustBeVeryLong123456789
jwt.expiration=86400000

