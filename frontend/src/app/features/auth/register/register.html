<main class="auth-page">
  <div class="auth-brand">
    <a class="brand" routerLink="/login" aria-label="WealthWise - trang đăng nhập">
      <span class="brand-mark" aria-hidden="true">W</span>
      <span>WealthWise</span>
    </a>
    <p>Quản lý chi tiêu cá nhân</p>
  </div>

  <section class="auth-card register-card" aria-label="Đăng ký tài khoản">
    <nav class="auth-tabs" aria-label="Tài khoản">
      <a class="auth-tab" routerLink="/login">
        <span class="material-symbols-outlined" aria-hidden="true">login</span>
        Đăng nhập
      </a>
      <a class="auth-tab active" routerLink="/register" aria-current="page">
        <span class="material-symbols-outlined" aria-hidden="true">person_add</span>
        Đăng ký
      </a>
    </nav>

    <a class="social-login-button google-button" routerLink="/login">
      <span class="google-mark" aria-hidden="true">G</span>
      Tiếp tục với Google
    </a>

    <div class="auth-divider"><span>HOẶC ĐĂNG KÝ VỚI EMAIL</span></div>
    @if (errorMessage()) {
      <p class="form-alert" role="alert">{{ errorMessage() }}</p>
    }

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" novalidate>
        <label class="field">
          <span>Họ và tên</span>
          <input
            formControlName="fullName"
            type="text"
            autocomplete="name"
            placeholder="Nguyễn Văn A"
            [attr.aria-invalid]="
              registerForm.controls.fullName.invalid && registerForm.controls.fullName.touched
            "
          />
          @if (
            registerForm.controls.fullName.touched &&
            registerForm.controls.fullName.hasError('required')
          ) {
            <small class="field-error">Vui lòng nhập họ và tên.</small>
          } @else if (
            registerForm.controls.fullName.touched &&
            registerForm.controls.fullName.hasError('pattern')
          ) {
            <small class="field-error">Họ và tên không được chỉ chứa khoảng trắng.</small>
          } @else if (
            registerForm.controls.fullName.touched &&
            registerForm.controls.fullName.hasError('maxlength')
          ) {
            <small class="field-error">Họ và tên không được vượt quá 100 ký tự.</small>
          }
        </label>

        <label class="field">
          <span>Email</span>
          <input
            formControlName="email"
            type="email"
            autocomplete="email"
            placeholder="nguyen.vana@example.com"
            [attr.aria-invalid]="
              registerForm.controls.email.invalid && registerForm.controls.email.touched
            "
          />
          @if (
            registerForm.controls.email.touched &&
            registerForm.controls.email.hasError('required')
          ) {
            <small class="field-error">Vui lòng nhập email.</small>
          } @else if (
            registerForm.controls.email.touched &&
            registerForm.controls.email.hasError('email')
          ) {
            <small class="field-error">Email chưa đúng định dạng.</small>
          }
        </label>

        <label class="field">
          <span>Tên đăng nhập</span>
          <input
            formControlName="username"
            type="text"
            autocomplete="username"
            placeholder="Tên đăng nhập"
            [attr.aria-invalid]="
              registerForm.controls.username.invalid && registerForm.controls.username.touched
            "
          />
          @if (
            registerForm.controls.username.touched &&
            registerForm.controls.username.hasError('required')
          ) {
            <small class="field-error">Vui lòng nhập tên đăng nhập.</small>
          } @else if (
            registerForm.controls.username.touched &&
            (
              registerForm.controls.username.hasError('minlength') ||
              registerForm.controls.username.hasError('maxlength')
            )
          ) {
            <small class="field-error">Tên tài khoản phải có từ 3 đến 30 ký tự.</small>
          }
        </label>

        <label class="field">
          <span>Mật khẩu</span>
          <input
            formControlName="password"
            type="password"
            autocomplete="new-password"
            placeholder="Ít nhất 8 ký tự"
            [attr.aria-invalid]="
              registerForm.controls.password.invalid && registerForm.controls.password.touched
            "
          />
          @if (
            registerForm.controls.password.touched &&
            registerForm.controls.password.hasError('required')
          ) {
            <small class="field-error">Vui lòng nhập mật khẩu.</small>
          } @else if (
            registerForm.controls.password.touched &&
            registerForm.controls.password.hasError('minlength')
          ) {
            <small class="field-error">Mật khẩu phải có ít nhất 8 ký tự.</small>
          }
        </label>

        <label class="field">
          <span>Xác nhận mật khẩu</span>
          <input
            formControlName="confirmPassword"
            type="password"
            autocomplete="new-password"
            placeholder="Nhập lại mật khẩu"
            [attr.aria-invalid]="isConfirmPasswordInvalid"
          />
          @if (
            registerForm.controls.confirmPassword.touched &&
            registerForm.controls.confirmPassword.hasError('required')
          ) {
            <small class="field-error">Vui lòng xác nhận mật khẩu.</small>
          } @else if (
            registerForm.controls.confirmPassword.touched &&
            registerForm.hasError('passwordMismatch')
          ) {
            <small class="field-error">Mật khẩu xác nhận không khớp.</small>
          }
        </label>

        <button class="primary-button" type="submit" [disabled]="isLoading()">
          {{ isLoading() ? 'Đang đăng ký...' : 'Đăng ký' }}
        </button>
      </form>

    <p class="auth-footer">
      Đã có tài khoản?
      <a routerLink="/login">Đăng nhập</a>
    </p>
  </section>

  <footer class="auth-legal">
    © 2024 WealthWise. Tất cả các quyền được bảo lưu.
    <span>•</span> Điều khoản sử dụng <span>•</span> Chính sách bảo mật
    <span>•</span> Hỗ trợ
  </footer>
</main>
